[[language]]
name = "python"
file-types = ["py","pyi","py3","pyw",".pythonstartup",".pythonrc"]
roots = [".", "pyproject.toml", "pyrightconfig.json"]
language-servers = ["pyright"]
shebangs = ["python"]
indent = { tab-width = 4, unit = "    " }

[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.pyright.config]
reportMissingTypeStubs = false

[[language]]
name = "php"
auto-format = false
language-servers = [ "intelephense", "typescript-language-server", "vscode-html-language-server", "snippets-ls"]
indent = { tab-width = 4, unit = "    " }

[language-server.intelephense.config]
environment = { phpVersion = "8.3.0" }
format = { braces = "k&r" }
telemetry = { enabled = false }
diagnostics = { relaxedTypeCheck = false, undefinedConstants = false, noMixedTypeCheck = false }
stubs = [
    # Defaults
    "apache","bcmath","bz2","calendar","com_dotnet","Core","ctype","curl","date",
    "dba","dom","enchant","exif","FFI","fileinfo","filter","fpm","ftp","gd",
    "gettext","gmp","hash","iconv","imap","intl","json","ldap","libxml",
    "mbstring","meta","mysqli","oci8","odbc","openssl","pcntl","pcre",
    "PDO","pdo_ibm","pdo_mysql","pdo_pgsql","pdo_sqlite","pgsql","Phar",
    "posix","pspell","readline","Reflection","session","shmop","SimpleXML",
    "snmp","soap","sockets","sodium","SPL","sqlite3","standard","superglobals",
    "sysvmsg","sysvsem","sysvshm","tidy","tokenizer","xml","xmlreader","xmlrpc",
    "xmlwriter","xsl","Zend OPcache","zip","zlib",

    # Custom
    "/home/marco/php-stubs",
]


[[language]]
name = "javascript"
auto-format = false
language-servers = [ "typescript-language-server", "vscode-html-language-server", "snippets-ls"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "html"
auto-format = false
language-servers = [ "typescript-language-server", "vscode-html-language-server", "snippets-ls"]
indent = { tab-width = 4, unit = "    " }

[[language]]
name = "css"
auto-format = false
language-servers = [ "vscode-css-language-server", "snippets-ls"]
indent = { tab-width = 4, unit = "    " }

[language-server.snippets-ls]
command = "snippets-ls"
args = ["-config", "~/.config/helix/snippets/package.json"]
indent = { tab-width = 4, unit = "    " }
